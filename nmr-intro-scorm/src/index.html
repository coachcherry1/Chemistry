<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro to ¹H NMR</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="titles">
    <h1>¹H NMR &mdash; an introduction</h1>
    <p id="blurb" class="blurb"></p>
  </div>
  <span id="lms" class="lms off">&nbsp;</span>
</header>

<nav id="tabs" class="tabs" aria-label="Levels"></nav>

<main>
  <div class="statusline">
    <h2 id="levelName"></h2>
    <span id="counter" class="counter"></span>
  </div>

  <div id="stage" class="stage">
    <div class="mainview">
      <div id="molview" class="molview"></div>
      <div id="plotwrap" class="plotwrap">
        <div id="plotinner" class="plotinner">
          <canvas id="plot" role="img" aria-label="Proton NMR spectrum"></canvas>
          <div id="overlay" class="overlay"></div>
        </div>
      </div>
      <p id="plotnote" class="plotnote" hidden>Scroll the spectrum sideways to see all of it.</p>
    </div>

    <div class="side">
      <div id="card" class="card"></div>
      <div id="tray" class="tray" tabindex="-1" aria-label="Labels to place"></div>
      <button id="check" type="button" class="primary check" hidden>Check my colours</button>
    </div>
  </div>

  <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

  <div id="choices" class="choices" hidden></div>

  <div class="controls">
    <button id="next" type="button" class="primary" hidden>Next compound &rarr;</button>
  </div>

  <details id="reference" class="reference">
    <summary id="refsummary">Reference</summary>
    <div id="refbody"></div>
  </details>
</main>

<div id="screen" class="screen" hidden></div>

<script src="js/shifts.js"></script>
<script src="js/molecules.js"></script>
<script src="js/analysis.js"></script>
<script src="js/spectrum.js"></script>
<script src="js/structures.js"></script>
<script src="js/levels.js"></script>
<script src="js/scorm.js"></script>
<script src="js/game.js"></script>
</body>
</html>
