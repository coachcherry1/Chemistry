<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f7fa"/><stop offset="1" stop-color="#dfe7ee"/></linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6b0"/><stop offset="0.08" stop-color="#b7c1c9"/><stop offset="1" stop-color="#a7b2bb"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e99a2"/><stop offset="0.45" stop-color="#eef2f5"/><stop offset="1" stop-color="#8794a0"/></linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset="1" stop-color="#8794a0"/></linearGradient>
    <linearGradient id="porc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#f6f6f6"/><stop offset="1" stop-color="#e2e2e2"/></linearGradient>
    <radialGradient id="rimIn" cx="0.5" cy="0.35" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d9d9"/></radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6dcc8"/></linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#59636d"/><stop offset="1" stop-color="#2f3740"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe6f3" stop-opacity="0.55"/><stop offset="0.5" stop-color="#eef8fd" stop-opacity="0.25"/><stop offset="1" stop-color="#bcd9ea" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="bal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#d3dbe1"/></linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8eef2"/><stop offset="0.4" stop-color="#ffffff"/><stop offset="1" stop-color="#d7e0e6"/></linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f6bd8" stop-opacity="0.9"/><stop offset="0.6" stop-color="#78b4ff" stop-opacity="0.7"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0.15"/></linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="0.5" stop-color="#aeb8c0"/><stop offset="1" stop-color="#e3e8ec"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="ringBack"><rect x="0" y="0" width="1280" height="335"/></clipPath>
    <clipPath id="ringFront"><rect x="0" y="335" width="1280" height="200"/></clipPath>
  </defs>

  <!-- the room and the bench -->
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect x="0" y="592" width="1280" height="128" fill="url(#bench)"/>
  <rect x="0" y="592" width="1280" height="4" fill="#ffffff" opacity="0.6"/>

  <!-- ===== ring stand ===== -->
  <g id="ring-stand">
    <ellipse cx="560" cy="592" rx="110" ry="9" fill="#000" opacity="0.18" filter="url(#soft)"/>
    <path d="M462 586 Q462 574 478 574 L642 574 Q658 574 658 586 L658 596 Q658 602 650 602 L470 602 Q462 602 462 596 Z" fill="url(#iron)" stroke="#262d34" stroke-width="1.5"/>
    <rect x="466" y="576" width="188" height="4" rx="2" fill="#ffffff" opacity="0.25"/>
    <rect x="553" y="60" width="14" height="518" rx="3" fill="url(#steel)" stroke="#6b7782" stroke-width="1"/>
  </g>

  <g id="raised" transform="translate(0,-62)">
<g clip-path="url(#ringBack)"><ellipse cx="322" cy="334" rx="108" ry="23" fill="none" stroke="#7f8b95" stroke-width="8"/><ellipse cx="322" cy="332" rx="108" ry="23" fill="none" stroke="#dfe6eb" stroke-width="3"/></g>
<!-- ===== clay triangle (back bar) ===== -->
  <g id="triangle-back">
    <line x1="232" y1="322" x2="412" y2="322" stroke="#a89e8a" stroke-width="15" stroke-linecap="round"/>
    <line x1="232" y1="322" x2="412" y2="322" stroke="url(#clay)" stroke-width="12" stroke-linecap="round"/>
    <line x1="238" y1="319" x2="406" y2="319" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ===== crucible ===== -->
  <g id="crucible" transform="translate(0,16)">
    <ellipse cx="322" cy="331" rx="30" ry="6" fill="#000" opacity="0.18"/>
    <path d="M270 220 C 274 262, 284 306, 298 330 L 346 330 C 360 306, 370 262, 374 220" fill="url(#porc)" stroke="#5f5f5f" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="322" cy="220" rx="52" ry="11" fill="url(#rimIn)" stroke="#5f5f5f" stroke-width="2"/>
    <ellipse cx="322" cy="222" rx="42" ry="7" fill="#d4d4d4" opacity="0.55"/>
    <!-- the magnesium inside (a small curled ribbon) -->
    <g id="mg-in-crucible"><path d="M300 224 q8 -7 14 -1 q6 6 12 -1 q6 -6 12 0" fill="none" stroke="#9aa5ad" stroke-width="3" stroke-linecap="round"/></g>
  </g>

  <!-- ===== lid, cracked open on the right ===== -->
  <g id="lid" transform="translate(-20,19) rotate(5 280 214)">
    <path d="M268 211 Q268 200 322 198 Q376 200 376 211 L376 215 Q376 224 322 226 Q268 224 268 215 Z" fill="url(#porc)" stroke="#5f5f5f" stroke-width="2"/>
    <ellipse cx="322" cy="203" rx="50" ry="6.5" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.2"/>
    <ellipse cx="322" cy="201" rx="7" ry="3" fill="#e6e6e6" stroke="#8a8a8a" stroke-width="1"/>
  </g>

  <!-- ===== clay triangle (front bars and wire ends) ===== -->
  <g id="triangle-front">
    <g stroke-linecap="round">
      <line x1="238" y1="322" x2="322" y2="356" stroke="#a89e8a" stroke-width="15"/><line x1="238" y1="322" x2="322" y2="356" stroke="url(#clay)" stroke-width="12"/>
      <line x1="406" y1="322" x2="322" y2="356" stroke="#a89e8a" stroke-width="15"/><line x1="406" y1="322" x2="322" y2="356" stroke="url(#clay)" stroke-width="12"/>
      <line x1="236" y1="321" x2="320" y2="354" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/><line x1="408" y1="321" x2="324" y2="354" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    </g>
    <!-- twisted wire ends resting on the ring -->
    <g stroke="#8a95a0" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M232 322 L214 316 M230 320 L211 322 M231 324 L213 330"/>
      <path d="M412 322 L430 316 M414 320 L433 322 M413 324 L431 330"/>
      <path d="M322 362 L322 372 M318 362 L316 374 M326 362 L328 374"/>
    </g>
  </g>

  <!-- ring, front half, and its arm -->
  <g id="ring-front">
    <g clip-path="url(#ringFront)"><ellipse cx="322" cy="334" rx="108" ry="23" fill="none" stroke="#7f8b95" stroke-width="8"/><ellipse cx="322" cy="332" rx="108" ry="23" fill="none" stroke="#dfe6eb" stroke-width="3"/></g>
    <rect x="428" y="327" width="132" height="9" rx="3" fill="url(#steelH)" stroke="#6b7782" stroke-width="1"/>
    <rect x="538" y="318" width="44" height="28" rx="5" fill="url(#iron)" stroke="#262d34" stroke-width="1.5"/>
    <circle cx="560" cy="332" r="5" fill="#8794a0" stroke="#262d34"/>
  </g>

  </g>

  <!-- ===== Bunsen burner ===== -->
  <g id="burner">
    <!-- flame (reaches the bottom of the crucible) -->
    <g id="flame">
      <path d="M322 428 C 296 392, 302 340, 316 314 C 319 306, 321 298, 322 290 C 323 298, 325 306, 328 314 C 342 340, 348 392, 322 428 Z" fill="url(#flameOuter)"/>
      <path d="M322 428 C 310 408, 312 384, 322 358 C 332 384, 334 408, 322 428 Z" fill="#2f6bd8" opacity="0.85"/>
    </g>
    <!-- hose -->
    <path d="M256 578 C 210 586, 160 604, 100 628 C 60 644, 30 670, 0 700" fill="none" stroke="#2b3138" stroke-width="12" stroke-linecap="round"/>
    <path d="M256 576 C 210 584, 160 602, 100 626 C 60 642, 30 668, 0 698" fill="none" stroke="#6b7782" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <ellipse cx="322" cy="590" rx="78" ry="9" fill="#000" opacity="0.18" filter="url(#soft)"/>
    <!-- base -->
    <path d="M250 580 Q250 566 268 562 L376 562 Q394 566 394 580 L394 586 Q394 594 380 594 L264 594 Q250 594 250 586 Z" fill="url(#iron)" stroke="#262d34" stroke-width="1.5"/>
    <rect x="262" y="565" width="112" height="3" rx="1.5" fill="#ffffff" opacity="0.25"/>
    <!-- barrel -->
    <rect x="309" y="428" width="26" height="136" rx="3" fill="url(#steel)" stroke="#6b7782" stroke-width="1"/>
    <rect x="306" y="424" width="32" height="8" rx="2" fill="url(#steelH)" stroke="#6b7782" stroke-width="1"/>
    <!-- air collar with holes -->
    <rect x="301" y="494" width="42" height="26" rx="3" fill="url(#iron)" stroke="#262d34" stroke-width="1.5"/>
    <ellipse cx="311" cy="507" rx="4" ry="6" fill="#0e1318"/><ellipse cx="322" cy="507" rx="4" ry="6" fill="#0e1318"/><ellipse cx="333" cy="507" rx="4" ry="6" fill="#0e1318"/>
    <!-- the bottom of the barrel: a knurled collar that turns to change the flame height -->
    <g id="gas-collar">
      <rect x="302" y="538" width="40" height="24" rx="3" fill="url(#steel)" stroke="#59636d" stroke-width="1.5"/>
      <g stroke="#59636d" stroke-width="1.4" opacity="0.8"><line x1="308" y1="540" x2="308" y2="560"/><line x1="314" y1="540" x2="314" y2="560"/><line x1="320" y1="540" x2="320" y2="560"/><line x1="326" y1="540" x2="326" y2="560"/><line x1="332" y1="540" x2="332" y2="560"/><line x1="338" y1="540" x2="338" y2="560"/></g>
      <path d="M296 574 Q322 588 348 574" fill="none" stroke="#2f6bd8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M296 574 l2 -9 l7 6 z" fill="#2f6bd8"/><path d="M348 574 l-2 -9 l-7 6 z" fill="#2f6bd8"/>
    </g>
  </g>

  <!-- ===== wire gauze pad (ceramic centre) ===== -->
  <g id="gauze">
    <path d="M428 676 L598 676 L598 681 L428 681 Z" fill="#6f7a84" stroke="#4d5963" stroke-width="1"/>
    <path d="M440 640 L610 640 L598 676 L428 676 Z" fill="#dfe5ea" stroke="#5f6b75" stroke-width="1.5"/>
    <g stroke="#6f7a84" stroke-width="0.9"><line x1="440.0" y1="640.0" x2="428.0" y2="676.0"/><line x1="440.0" y1="640.0" x2="610.0" y2="640.0"/><line x1="458.9" y1="640.0" x2="446.9" y2="676.0"/><line x1="438.7" y1="644.0" x2="608.7" y2="644.0"/><line x1="477.8" y1="640.0" x2="465.8" y2="676.0"/><line x1="437.3" y1="648.0" x2="607.3" y2="648.0"/><line x1="496.7" y1="640.0" x2="484.7" y2="676.0"/><line x1="436.0" y1="652.0" x2="606.0" y2="652.0"/><line x1="515.6" y1="640.0" x2="503.6" y2="676.0"/><line x1="434.7" y1="656.0" x2="604.7" y2="656.0"/><line x1="534.4" y1="640.0" x2="522.4" y2="676.0"/><line x1="433.3" y1="660.0" x2="603.3" y2="660.0"/><line x1="553.3" y1="640.0" x2="541.3" y2="676.0"/><line x1="432.0" y1="664.0" x2="602.0" y2="664.0"/><line x1="572.2" y1="640.0" x2="560.2" y2="676.0"/><line x1="430.7" y1="668.0" x2="600.7" y2="668.0"/><line x1="591.1" y1="640.0" x2="579.1" y2="676.0"/><line x1="429.3" y1="672.0" x2="599.3" y2="672.0"/><line x1="610.0" y1="640.0" x2="598.0" y2="676.0"/><line x1="428.0" y1="676.0" x2="598.0" y2="676.0"/></g>
    <ellipse cx="519" cy="658" rx="40" ry="11" fill="#efe7d6" stroke="#9a8f78" stroke-width="1.4"/>
    <ellipse cx="519" cy="657" rx="32" ry="8" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- ===== DI water dropper bottle ===== -->
  <g id="di-bottle" transform="translate(-75,0)">
    <ellipse cx="170" cy="598" rx="34" ry="5" fill="#000" opacity="0.16" filter="url(#soft)"/>
    <path d="M148 592 L148 520 Q148 500 160 494 L160 484 L180 484 L180 494 Q192 500 192 520 L192 592 Q192 598 186 598 L154 598 Q148 598 148 592 Z" fill="url(#plastic)" stroke="#7f8f9a" stroke-width="1.6"/>
    <path d="M162 484 L162 462 L178 462 L178 484 Z" fill="#fff" stroke="#7f8f9a" stroke-width="1.6"/>
    <path d="M165 462 L170 440 L175 462 Z" fill="#f5f5f5" stroke="#7f8f9a" stroke-width="1.6"/>
    <rect x="150" y="530" width="40" height="34" rx="3" fill="#2f6bd8"/><text x="170" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">DI</text><text x="170" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">H₂O</text>
  </g>

  <!-- ===== analytical balance ===== -->
  <g id="balance">
    <ellipse cx="960" cy="598" rx="150" ry="9" fill="#000" opacity="0.16" filter="url(#soft)"/>
    <!-- base with display -->
    <path d="M820 596 L820 506 Q820 496 832 496 L1088 496 Q1100 496 1100 506 L1100 596 Q1100 602 1094 602 L826 602 Q820 602 820 596 Z" fill="url(#bal)" stroke="#8795a1" stroke-width="2"/>
    <rect x="850" y="516" width="190" height="56" rx="7" fill="#1b2a2f" stroke="#5f6f79" stroke-width="2"/>
    <text x="1030" y="556" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="700" fill="#7dffb0">0.1356 g</text>
    <circle cx="1068" cy="534" r="14" fill="#f0f3f5" stroke="#8795a1" stroke-width="2"/><text x="1068" y="538" text-anchor="middle" font-size="9" font-weight="700" fill="#4d5c67">TARE</text>
    <circle cx="1068" cy="568" r="9" fill="#f0f3f5" stroke="#8795a1" stroke-width="2"/>
    <!-- draft shield -->
    <rect x="836" y="330" width="248" height="166" rx="6" fill="#eaf4fa" fill-opacity="0.35" stroke="#8fa8b8" stroke-width="2"/>
    <rect x="846" y="340" width="228" height="8" rx="3" fill="#ffffff" opacity="0.45"/>
    <!-- the front door, swung open to the right -->
    <polygon points="1084,330 1148,352 1148,476 1084,496" fill="url(#glass)" stroke="#8fa8b8" stroke-width="2"/>
    <polygon points="1084,330 1148,352 1148,360 1084,338" fill="#ffffff" opacity="0.4"/>
    <rect x="1138" y="396" width="6" height="44" rx="2" fill="#8fa8b8"/>
    <!-- pan and the magnesium on weighing paper -->
    <rect x="955" y="470" width="14" height="26" fill="url(#steel)"/>
    <ellipse cx="962" cy="470" rx="68" ry="9" fill="url(#steel)" stroke="#6b7782" stroke-width="1.5"/>
    <g id="weigh-paper"><path d="M930 468 L994 468 L1002 476 L922 476 Z" fill="#ffffff" stroke="#b8c3cc" stroke-width="1.2"/></g>
    <g id="mg-piece"><path d="M936 468 q8 -9 15 -2 q7 8 14 -2 q7 -8 14 -1 q4 4 8 1" fill="none" stroke="#7d8891" stroke-width="5" stroke-linecap="round"/>
      <path d="M936 466.5 q8 -9 15 -2 q7 8 14 -2 q7 -8 14 -1 q4 4 8 1" fill="none" stroke="url(#mg)" stroke-width="2.6" stroke-linecap="round"/></g>
  </g>

  <!-- labels (to talk about the sketch; these would come off) -->
  <g id="labels" font-size="16" font-weight="600" fill="#34495e" paint-order="stroke" stroke="#f3f7fa" stroke-width="5" stroke-linejoin="round">
    <g stroke="#34495e" stroke-width="1.2" fill="none" opacity="0.75" stroke-linecap="round" paint-order="normal">
      <path d="M590 92 L568 112"/><path d="M130 252 L222 262"/><path d="M432 168 L378 168"/><path d="M432 272 L430 272"/>
      <path d="M432 352 L346 340"/><path d="M432 505 L340 505"/><path d="M432 594 L350 574"/><path d="M60 470 L76 500"/>
      <path d="M514 634 L514 640"/><path d="M1130 324 L1124 346"/><path d="M1096 474 L1006 466"/><path d="M940 612 L940 604"/>
    </g>
    <text x="596" y="90">Ring stand and ring</text>
    <text x="24" y="248">Clay triangle</text>
    <text x="438" y="174">Crucible, lid cracked open</text>
    <text x="438" y="278">Ring on the stand</text>
    <text x="438" y="358">Flame touches the crucible</text>
    <text x="438" y="510">Bunsen burner</text>
    <text x="438" y="598" font-size="14">Turn the bottom to change the flame</text>
    <text x="20" y="462">DI water dropper</text>
    <text x="470" y="702">Wire gauze pad</text>
    <text x="1090" y="318">Balance door, open</text>
    <text x="1100" y="478">Mg on weighing paper</text>
    <text x="826" y="630" font-size="14">Analytical balance, reads to 0.0001 g</text>
  </g>
</svg>
