<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combustion Analysis</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="titles">
    <h1>Combustion analysis of a hydrocarbon: the four steps</h1>
  </div>
  <div class="top-right">
    <span id="score" class="score"></span>
    <button id="ptTop" type="button" class="mini" aria-controls="ptPanel" aria-expanded="false">Periodic table</button>
    <span id="lms" class="lms off">&nbsp;</span>
  </div>
</header>

<nav id="parts" class="tabs" aria-label="Parts"></nav>

<main>
  <div class="statusline">
    <h2 id="stepTitle"></h2>
    <div class="topnav">
      <span id="counter" class="counter"></span>
      <button id="backTop" type="button" class="ghostbtn">&larr; Back</button>
      <button id="nextTop" type="button" class="primary" disabled>Next &rarr;</button>
    </div>
  </div>
  <p id="instructions" class="instructions"></p>

  <div id="stage" class="stage"></div>

  <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

  <div class="controls">
    <button id="back" type="button" class="ghostbtn">&larr; Back</button>
    <button id="next" type="button" class="primary" disabled>Next &rarr;</button>
  </div>
</main>

<div id="screen" class="screen" hidden></div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/elements.js"></script>
<script src="js/compounds.js"></script>
<script src="js/chem.js"></script>
<script src="js/problems.js"></script>
<script src="js/tex.js"></script>
<script src="js/ptable.js"></script>
<script src="js/finder.js"></script>
<script src="js/work.js"></script>
<script src="js/drills.js"></script>
<script src="js/scenes.js"></script>
<script src="js/scorm.js"></script>
<script src="js/app.js"></script>
</body>
</html>
